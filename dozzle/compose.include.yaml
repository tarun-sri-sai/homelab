services:
  dozzle:
    hostname: dozzle
    image: docker.io/amir20/dozzle:v11.1.0-alpine
    networks:
      - nginx_net
    restart: always
    volumes:
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock:ro
      - ./users.yml:/data/users.yml
    environment:
      - DOZZLE_AUTH_PROVIDER=simple
      - DOZZLE_DISABLE_SETUP_WIZARD=true
