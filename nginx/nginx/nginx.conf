events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    client_max_body_size 0;

    sendfile on;
    tcp_nopush on;

    server {
        listen 3000;
        server_name _;

        location / {
            proxy_pass http://forgejo:3000;

            include /etc/nginx/snippets/proxy-common.conf;
            include /etc/nginx/snippets/proxy-keepalive.conf;
        }
    }

    server {
        listen 8333;
        server_name _;

        location / {
            proxy_pass http://s3:8333;

            include /etc/nginx/snippets/proxy-common.conf;
            include /etc/nginx/snippets/proxy-keepalive.conf;
        }
    }

    server {
        listen 2283;
        server_name _;

        location / {
            proxy_pass http://immich-server:2283;

            include /etc/nginx/snippets/proxy-common.conf;
            include /etc/nginx/snippets/proxy-keepalive.conf;
        }
    }

    server {
        listen 8080;
        server_name _;

        location / {
            proxy_pass http://open-webui:8080;

            include /etc/nginx/snippets/proxy-common.conf;
            include /etc/nginx/snippets/proxy-websocket.conf;
        }
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://nextcloud:80;

            include /etc/nginx/snippets/proxy-common.conf;
            include /etc/nginx/snippets/proxy-keepalive.conf;
        }
    }

    server {
        listen 5650;
        server_name _;

        location / {
            proxy_pass http://bifrost:8080;

            include /etc/nginx/snippets/proxy-common.conf;
            include /etc/nginx/snippets/proxy-websocket.conf;
        }
    }

    server {
        listen 8181;
        server_name _;

        location / {
            proxy_pass http://influxdb:8181;

            include /etc/nginx/snippets/proxy-common.conf;
            include /etc/nginx/snippets/proxy-keepalive.conf;
        }
    }

    server {
        listen 5338;
        server_name _;

        location / {
            proxy_pass http://grafana:3000;

            include /etc/nginx/snippets/proxy-common.conf;
            include /etc/nginx/snippets/proxy-keepalive.conf;
        }
    }

    server {
        listen 8888;
        server_name _;

        location / {
            proxy_pass http://dozzle:8080;

            include /etc/nginx/snippets/proxy-common.conf;
            include /etc/nginx/snippets/proxy-websocket.conf;
        }
    }

    server {
        listen 8096;
        server_name _;

        location / {
            proxy_pass http://jellyfin:8096;

            include /etc/nginx/snippets/proxy-common.conf;
            include /etc/nginx/snippets/proxy-websocket.conf;
        }
    }

    server {
        listen 9211;
        server_name _;

        location / {
            proxy_pass http://influxdb-ui:8080;

            include /etc/nginx/snippets/proxy-common.conf;
            include /etc/nginx/snippets/proxy-keepalive.conf;
        }
    }
}

stream {
    server {
        listen 2222;
        proxy_pass forgejo:22;
    }
}
